<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Une petite surprise 🌹</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#120812,#3b0d22,#140812);
  color:white; font-family:Arial,sans-serif; overflow:hidden;
}
.card{
  width:min(90%,420px); text-align:center; padding:38px 24px;
  border:1px solid rgba(255,255,255,.18); border-radius:28px;
  background:rgba(255,255,255,.08); backdrop-filter:blur(10px);
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}
.rose{font-size:100px; animation:float 2.5s ease-in-out infinite}
h1{font-size:28px;margin:12px 0}
p{font-size:18px;line-height:1.6;color:#f7dfe8}
button{
  border:0;border-radius:999px;padding:14px 24px;font-size:17px;
  background:#fff;color:#8b173d;cursor:pointer;font-weight:bold;
}
#msg{display:none;margin-top:20px}
.heart{position:fixed;bottom:-30px;font-size:22px;animation:rise 5s linear infinite;opacity:.8}
@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes rise{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
  <div class="rose">🌹</div>
  <h1>Yon ti sipriz pou ou ❤️</h1>
  <p>Mwen pa bezwen yon gwo okazyon pou m voye yon bèl flè ba ou.</p>
  <button onclick="surprise()">Klike sou mwen 🌹</button>
  <div id="msg"><p><strong>Ou se yon moun espesyal. Mwen espere ti flè sa fè w souri. ❤️</strong></p></div>
</div>
<script>
function surprise(){
  document.getElementById('msg').style.display='block';
  for(let i=0;i<18;i++){
    const h=document.createElement('div');
    h.className='heart'; h.textContent=['❤️','💕','🌸','✨'][Math.floor(Math.random()*4)];
    h.style.left=Math.random()*100+'vw';
    h.style.animationDelay=Math.random()*1.5+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
  }
}
</script>
</body>
</html>
